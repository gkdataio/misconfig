name: Release

# Pushing a version tag such as v1.5.0 releases the commit it names. The
# archive is packed once, tried on Linux, macOS and Windows, and staged on
# npm. Staging doesn't publish it: a maintainer approves the staged release
# on npm with two-factor authentication before anyone can install it.
#
# Staging is off until the repository variable STAGE_ON_NPM is true. Until
# then a tag is tested, packed and tried, and nothing is sent to npm. A push
# to a release branch is a rehearsal, which packs and tries the archive.
# docs/releasing.md has the steps and the setup.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    branches: ['release-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A rehearsal gives way to a newer push. A release runs to the end.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history, to tell whether a tag is on main.
          fetch-depth: 0
      # Node.js 24.18 is the first whose npm can stage a release.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '^24.18.0'
          package-manager-cache: false
      - name: Check the tag names this version and is on main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag is $TAG, and package.json says $version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG isn't on main. A release is tagged on main."
            exit 1
          fi
      - name: Pack the archive
        id: pack
        run: |
          set -o pipefail
          file="$(npm pack --ignore-scripts | tail -n 1)"
          sha256="$(sha256sum "$file" | cut -d ' ' -f 1)"
          {
            echo "file=$file"
            echo "sha256=$sha256"
            echo "version=$(jq -r .version package.json)"
          } >> "$GITHUB_OUTPUT"
          echo "$sha256  $file"
      # Sends nothing. It stops the run here if npm already has this version
      # or wouldn't take the archive. A tag that won't be staged skips it.
      - name: Rehearse staging it
        if: github.ref_type != 'tag' || vars.STAGE_ON_NPM == 'true'
        env:
          FILE: ${{ steps.pack.outputs.file }}
        run: npm stage publish "./$FILE" --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
          # So this job can be run again. The jobs after it run again too, and
          # check the archive against the digest from the same run of this one.
          overwrite: true

  try:
    name: Try on ${{ matrix.os }} with Node ${{ matrix.node }}
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest and the newest Node.js the tests run on.
        node: ['18', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive
          path: archive
      - name: Install the archive and run it
        env:
          ARCHIVE: archive/${{ needs.pack.outputs.file }}
          SHA256: ${{ needs.pack.outputs.sha256 }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: node .github/scripts/try-archive.mjs

  tests:
    name: Tests
    # A push to a release branch already runs these, in the Tests workflow.
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/tests.yml

  stage:
    name: Stage on npm
    if: github.ref_type == 'tag' && vars.STAGE_ON_NPM == 'true'
    needs: [pack, try, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm takes a release from this workflow in this environment and from
    # nowhere else.
    environment: npm
    permissions:
      # Lets npm see which repository, workflow and commit this run is. No
      # npm token is stored anywhere: npm trusts this workflow to stage a
      # release, and not to publish one.
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '^24.18.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive
          path: archive
      - name: Check it's the archive that was tried
        env:
          FILE: ${{ needs.pack.outputs.file }}
          SHA256: ${{ needs.pack.outputs.sha256 }}
        run: echo "$SHA256  archive/$FILE" | sha256sum --check --strict
      # --provenance records this commit and run with the release, and stops
      # the step if that can't be done.
      - name: Stage it
        env:
          FILE: ${{ needs.pack.outputs.file }}
        run: |
          if ! npm stage publish "./archive/$FILE" --provenance --access public; then
            echo "::error::npm didn't take the release. If it asked for a login, npm doesn't trust this workflow yet. docs/releasing.md has the one-time setup."
            exit 1
          fi

  draft:
    name: Draft the GitHub release
    if: github.ref_type == 'tag'
    needs: [pack, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To create the draft and attach the archive.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive
          path: archive
      # The notes are this version's part of the changelog in the archive.
      - name: Draft it with the archive attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ needs.pack.outputs.file }}
          SHA256: ${{ needs.pack.outputs.sha256 }}
          VERSION: ${{ needs.pack.outputs.version }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          echo "$SHA256  archive/$FILE" | sha256sum --check --strict
          tar -xzOf "archive/$FILE" package/CHANGELOG.md |
            awk -v version="$VERSION" '/^## / { on = ($2 == version); next } on' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has nothing under $VERSION."
            exit 1
          fi
          {
            echo
            echo "The attached \`$FILE\` is the archive this release was made from. [GitHub Actions]($RUN) packed it from this tag, tried it on Linux, macOS and Windows with Node.js 18 and 24, and staged it on npm for approval. Its SHA-256 is \`$SHA256\`."
          } >> notes.md
          gh release create "$TAG" "archive/$FILE" --draft --verify-tag --title "misconfig $VERSION" --notes-file notes.md
