name: Misconfig

on:
  pull_request:
  merge_group:
  push:
    # A release branch is checked before it's merged.
    branches: [main, 'release-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-config:
    name: Agent config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Lets the last step send the findings to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The action in this repository, at the commit being checked, so every
      # change to it runs on a real runner before a release.
      - name: Check this repository
        id: misconfig
        uses: ./
        with:
          fail-on: high
      - name: Send the findings to code scanning
        if: ${{ !cancelled() && steps.misconfig.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: ${{ steps.misconfig.outputs.sarif }}
          category: misconfig
