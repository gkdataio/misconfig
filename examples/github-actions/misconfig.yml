name: Misconfig

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-config:
    name: Agent config
    runs-on: ubuntu-latest
    # A check takes seconds. Without this, a job that hangs runs for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Scan the checked-out repository
        run: |
          cd "$RUNNER_TEMP"
          npx --yes @misconfig/cli@1.5.0 "$GITHUB_WORKSPACE" --project-only --fail-on high
